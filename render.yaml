services:
  - type: web
    name: e2e3611-web-trad
    runtime: node
    repo: https://github.com/render-examples/express-hello-world
    branch: main
    plan: starter
    region: oregon
    buildCommand: yarn install --production=false
    startCommand: node app.js
    autoDeploy: false
  - type: web
    name: e2e3611-web-linked
    buildSource: express-hello-world-as
    startCommand: node app.js
    plan: starter
    region: oregon
    autoDeploy: false
  - type: web
    name: e2e3611-web-new
    buildSource: express-hello-world-as
    startCommand: node app.js
    plan: starter
    region: oregon
  - type: cron
    name: e2e3611-cron-new
    buildSource: express-hello-world-as
    startCommand: node app.js
    schedule: "0 5 1 * *"
    plan: starter
    region: oregon
  - type: web
    name: e2e3611-web-unknown
    buildSource: does-not-exist
    startCommand: node app.js
    plan: starter
    region: oregon
